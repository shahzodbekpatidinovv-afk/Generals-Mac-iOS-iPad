steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Install dependencies
    run: |
      brew install cmake ninja meson pkgconf xcodegen

  - name: Initialize DXVK
    run: |
      git submodule update --init --recursive references/fbraz3-dxvk

  - name: Fetch MoltenVK
    run: |
      ./scripts/build/ios/fetch-moltenvk.sh

  - name: Stage fonts
    run: |
      ./scripts/build/ios/stage-fonts.sh

  - name: Configure
    run: |
      cmake --preset ios-vulkan

  - name: Build
    run: |
      cmake --build build/ios-vulkan --target z_generals --parallel 3

  - name: Package IPA
    env:
      GX_TEAM_ID: ${{ secrets.GX_TEAM_ID }}
      GX_BUNDLE_ID: com.shahzodbek.generalszh
    run: |
      if [ -z "$GX_TEAM_ID" ]; then
        echo "GX_TEAM_ID secret is missing"
        exit 1
      fi

      ./scripts/build/ios/package-ios-zh.sh

  - name: Find IPA
    run: |
      find . -name "*.ipa" -type f -print

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: GeneralsZH-iOS-IPA
      path: "**/*.ipa"
      if-no-files-found: error
