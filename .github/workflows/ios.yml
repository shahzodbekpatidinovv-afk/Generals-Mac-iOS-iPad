name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "CMAKE_MAKE_PROGRAM=$(which ninja)" >> $GITHUB_ENV

      - name: Fix Missing Toolchain and Submodules
        run: |
          git submodule update --init --recursive --force
          mkdir -p scripts/buildsystems
          if [ ! -f "scripts/buildsystems/vcpkg.cmake" ]; then
            git clone https://github.com/microsoft/vcpkg.git external/vcpkg
            cp external/vcpkg/scripts/buildsystems/vcpkg.cmake scripts/buildsystems/vcpkg.cmake
          fi

      - name: Setup project and build
        run: |
          chmod +x ./scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh
          cmake --preset ios-vulkan -DCMAKE_MAKE_PROGRAM=$(which ninja)
          cmake --build --preset ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          ./scripts/build/ios/package-ios-zh.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-IPA
          path: build/ios-vulkan/*.ipa
