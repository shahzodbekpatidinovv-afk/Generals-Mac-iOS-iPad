name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/external/vcpkg
          $GITHUB_WORKSPACE/external/vcpkg/bootstrap-vcpkg.sh
          mkdir -p scripts/buildsystems
          cp $GITHUB_WORKSPACE/external/vcpkg/scripts/buildsystems/vcpkg.cmake scripts/buildsystems/vcpkg.cmake

      - name: Setup project and build
        run: |
          chmod +x ./scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh
          cmake -B build/ios-vulkan -S . -G "Ninja" \
            -DCMAKE_MAKE_PROGRAM=/opt/homebrew/bin/ninja \
            -DVCPKG_ROOT=$GITHUB_WORKSPACE/external/vcpkg \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/scripts/buildsystems/vcpkg.cmake
          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          ./scripts/build/ios/package-ios-zh.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-IPA
          path: build/ios-vulkan/*.ipa
