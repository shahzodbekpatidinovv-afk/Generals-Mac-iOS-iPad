name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkgconf xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup vcpkg environment
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Setup project and build
        run: |
          chmod +x ./scripts/build/ios/*.sh

          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

          mkdir -p Generals/Code/CompatLib/Include

          printf '#pragma once\n' > Generals/Code/CompatLib/Include/windows_base.h
          printf 'typedef int LONG;\n' >> Generals/Code/CompatLib/Include/windows_base.h
          printf 'typedef unsigned int DWORD;\n' >> Generals/Code/CompatLib/Include/windows_base.h
          printf 'typedef int BOOL;\n' >> Generals/Code/CompatLib/Include/windows_base.h
          printf 'typedef int INT;\n' >> Generals/Code/CompatLib/Include/windows_base.h
          printf 'struct RECT { LONG left; LONG top; LONG right; LONG bottom; };\n' >> Generals/Code/CompatLib/Include/windows_base.h

          printf '#pragma once\n' > Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef int D3DFORMAT;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_XYZ 0x002\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_NORMAL 0x010\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_DIFFUSE 0x040\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_SPECULAR 0x080\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_TEX1 0x100\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_TEX2 0x200\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_TEX3 0x300\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf '#define D3DFVF_TEX4 0x400\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef struct _D3DVECTOR { float x; float y; float z; } D3DVECTOR;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef struct _D3DMATRIX { union { struct { float _11, _12, _13, _14; float _21, _22, _23, _24; float _31, _32, _33, _34; float _41, _42, _43, _44; }; float m[4][4]; }; } D3DMATRIX;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef struct _D3DCAPS8 { int Dummy; } D3DCAPS8;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef struct _D3DADAPTER_IDENTIFIER8 { int Dummy; } D3DADAPTER_IDENTIFIER8;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef struct _D3DVIEWPORT8 { DWORD X; DWORD Y; DWORD Width; DWORD Height; float MinZ; float MaxZ; } D3DVIEWPORT8;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef struct _D3DMATERIAL8 { int Dummy; } D3DMATERIAL8;\n' >> Generals/Code/CompatLib/Include/d3d8types.h
          printf 'typedef enum _D3DTRANSFORMSTATETYPE { D3DTS_WORLD = 1, D3DTS_VIEW = 2, D3DTS_PROJECTION = 3, D3DTS_TEXTURE0 = 16 } D3DTRANSFORMSTATETYPE;\n' >> Generals/Code/CompatLib/Include/d3d8types.h

          printf '#pragma once\n' > Generals/Code/CompatLib/Include/d3d8.h
          printf '#include "d3d8types.h"\n' >> Generals/Code/CompatLib/Include/d3d8.h
          printf 'class IDirect3D8 { public: int Dummy; };\n' >> Generals/Code/CompatLib/Include/d3d8.h

          echo "" > GeneralsMD/Code/CompatLib/dummy.cpp
          echo "cmake_minimum_required(VERSION 3.15)" > GeneralsMD/Code/CompatLib/CMakeLists.txt
