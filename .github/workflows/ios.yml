name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkgconf xcodegen glm sdl3 curl openssl
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup project and build
        run: |
          chmod +x ./scripts/build/ios/*.sh

          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

          cmake -B build/ios-vulkan -S . \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/homebrew/bin/ninja \
            -DCMAKE_PREFIX_PATH="/opt/homebrew;/opt/homebrew/opt/curl;/opt/homebrew/opt/openssl" \
            -DCURL_DIR="/opt/homebrew/opt/curl/lib/cmake/CURL" \
            -DSAGE_USE_SDL3=ON \
            -DSAGE_BUILD_D3DX8=ON

          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          ./scripts/build/ios/package-ios-zh.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-IPA
          path: build/ios-vulkan/*.ipa
          if-no-files-found: error
