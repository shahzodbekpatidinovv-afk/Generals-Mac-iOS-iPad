name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkgconf xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup vcpkg environment
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Setup project and build
        run: |
          chmod +x ./scripts/build/ios/*.sh

          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

          # Windows va DirectX turlari hamda FVF makroslarini to'liq to'ldiramiz
          mkdir -p Generals/Code/CompatLib/Include
          cat << 'EOF' > Generals/Code/CompatLib/Include/windows_base.h
          #pragma once
          typedef int LONG;
          typedef unsigned int DWORD;
          typedef int BOOL;
          typedef int INT;
          struct RECT {
              LONG left;
              LONG top;
              LONG right;
              LONG bottom;
          };
          EOF

          cat << 'EOF' > Generals/Code/CompatLib/Include/d3d8types.h
          #pragma once
          typedef int D3DFORMAT;

          #define D3DFVF_XYZ 0x002
          #define D3DFVF_NORMAL 0x010
          #define D3DFVF_DIFFUSE 0x040
          #define D3DFVF_SPECULAR 0x080
          #define D3DFVF_TEX1 0x100
          #define D3DFVF_TEX2 0x200
          #define D3DFVF_TEX3 0x300
          #define D3DFVF_TEX4 0x400

          typedef struct _D3DVECTOR {
              float x;
              float y;
              float z;
          } D3DVECTOR;

          typedef struct _D3DMATRIX {
              union {
                  struct {
                      float _11, _12, _13, _14;
                      float _21, _22, _23, _24;
                      float _31, _32, _33, _34;
                      float _41, _42, _43, _44;
                  };
                  float m[4][4];
              };
          } D3DMATRIX;

          typedef struct _D3DCAPS8 {
              int Dummy;
          } D3DCAPS8;

          typedef struct _D3DADAPTER_IDENTIFIER8 {
              int Dummy;
          } D3DADAPTER_IDENTIFIER8;
          EOF

          cat << 'EOF' > Generals/Code/CompatLib/Include/d3d8.h
          #pragma once
          #include "d3d8types.h"
          class IDirect3D8 {
          public:
              int Dummy;
          };
          EOF

          echo "" > GeneralsMD/Code/CompatLib/dummy.cpp
          echo "cmake_minimum_required(VERSION 3.15)" > GeneralsMD/Code/CompatLib/CMakeLists.txt
          echo "project(CompatLib)" >> GeneralsMD/Code/CompatLib/CMakeLists.txt
          echo "add_library(CompatLib STATIC dummy.cpp)" >> GeneralsMD/Code/CompatLib/CMakeLists.txt
          echo "target_include_directories(CompatLib PUBLIC Include)" >> GeneralsMD/Code/CompatLib/CMakeLists.txt

          for i in {1..3}; do
            cmake -B build/ios-vulkan -S . \
              -G Ninja \
              -DCMAKE_MAKE_PROGRAM=/opt/homebrew/bin/ninja \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=arm64-ios \
              -DSAGE_USE_SDL3=ON \
              -DCMAKE_CXX_FLAGS="-Wno-error -Wno-everything" \
              -DCMAKE_C_FLAGS="-Wno-error -Wno-everything" && break || sleep 5;
          done

          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          ./scripts/build/ios/package-ios-zh.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-IPA
          path: build/ios-vulkan/*.ipa
          if-no-files-found: error
